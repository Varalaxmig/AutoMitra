name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within the 7-day inactivity pause window)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab or VS Code extension

jobs:
  keep-alive:
    name: Ping Supabase PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase Keep-Alive Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx --yes tsx scripts/keep-supabase-alive.ts
